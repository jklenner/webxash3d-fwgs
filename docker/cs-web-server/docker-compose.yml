services:
  xash3d:
    image: cs-web-server:0.0.5-rc2
#    entrypoint: []
#    command: sleep infinity
    command: ["+map aim_map_2010", "+maxplayers 14"]
#    network_mode: host
    networks: [default]
    restart: always
    platform: linux/386
    environment:
      PORT: 27018
      IP: 10.10.16.42
#      IP: 80.151.134.21
      DISABLE_X_POWERED_BY: true
    volumes:
      - "./mnt/client/valve.zip:/xashds/public/valve.zip"
      - "./configs/cstrike/server.cfg:/xashds/cstrike/server.cfg"
      - "./mnt/addons/:/xashds/cstrike/addons/"
      - "./configs/cstrike/mapcycle.txt:/xashds/cstrike/mapcycle.txt"
      - "./mnt/maps/:/xashds/cstrike/maps/"
      - "./mnt/liblist.gam:/xashds/cstrike/liblist.gam"
    ports:
      - "80:27016"
      - "27018:27018/tcp"
      - "27018:27018/udp"

  caddy:
    image: caddy:2
    networks: [default]
    restart: unless-stopped
    ports:
      - "443:443"
    depends_on:
      - xash3d
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config

networks:
  csnet:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1200"   # try 1380–1400 if VPNs are flaky
